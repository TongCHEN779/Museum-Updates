name: Daily update & deploy

on:
  schedule:
    - cron: "0 5 * * *"   # 每天 05:00 UTC（丹麦时间 06:00/07:00）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Fetch museum pages and parse
        run: python scraper/scrape.py
      - name: Commit updated data
        run: |
          git config user.name "museum-bot"
          git config user.email "museum-bot@users.noreply.github.com"
          git add data/museums.json
          git diff --cached --quiet || git commit -m "chore: daily data update"
          git push || true
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/museums.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
